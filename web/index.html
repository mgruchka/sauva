<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAÚVA — documentos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="min-h-screen bg-[#F6F1E7] text-[#40100A]">
  <main class="mx-auto max-w-4xl p-6">
    <header class="mb-8 flex items-center gap-3"><img src="/assets/sauva-logo.svg" alt="" class="h-12 w-12"><h1 class="text-3xl font-bold">SAÚVA</h1><span class="text-sm">Protótipo de registros de saúde</span></header>
    <p id="notice" class="mb-4 rounded bg-white p-3" role="status">Validação estrutural do protótipo; conformidade BR Core ainda não verificada.</p>
    <section id="login-area" class="rounded-xl bg-white p-6 shadow">
      <h2 class="mb-4 text-xl font-bold">Entrar</h2>
      <form id="login-form" class="grid gap-3">
        <label>Email <input id="email" type="email" required autocomplete="username" class="w-full rounded border p-2"></label>
        <label>Senha <input id="password" type="password" required autocomplete="current-password" class="w-full rounded border p-2"></label>
        <button class="rounded bg-[#14472C] p-2 text-white">Entrar</button>
      </form>
    </section>
    <section id="dashboard" hidden class="space-y-5">
      <div class="flex justify-between"><h2 class="text-xl font-bold">Meus documentos</h2><button id="logout" class="underline">Sair</button></div>
      <form id="upload-form" class="grid gap-3 rounded-xl bg-white p-6 shadow">
        <label>Nome do documento <input id="doc-name" class="w-full rounded border p-2" placeholder="Opcional"></label>
        <label>Arquivo PDF ou JPEG (até 10 MB e 10 páginas) <input id="file" type="file" accept=".pdf,.jpg,.jpeg,application/pdf,image/jpeg" required class="w-full p-2"></label>
        <input type="hidden" id="document-type" value="Texto">
        <button class="rounded bg-[#14472C] p-2 text-white">Enviar documento de texto</button>
      </form>
      <div id="documents" class="space-y-3"></div>
      <p class="text-sm text-[#6E6259]">Pastas, imagens médicas, PDF de saída e compartilhamento serão adicionados depois.</p>
    </section>
  </main>
  <script src="/assets/app.js" defer></script>
</body>
</html>
